<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Vision Playground</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
        * { font-family: 'Inter', sans-serif; }
        .mono { font-family: 'JetBrains Mono', monospace; }

        .drop-active { background: rgba(99,102,241,.12) !important; border-color: #6366f1 !important; }

        .thinking-dots span { animation: blink 1.4s infinite both; }
        .thinking-dots span:nth-child(2) { animation-delay:.2s; }
        .thinking-dots span:nth-child(3) { animation-delay:.4s; }
        @keyframes blink { 0%,80%,100%{opacity:0} 40%{opacity:1} }

        .cursor::after { content:'▊'; animation: cblink .9s step-start infinite; color:#818cf8; }
        @keyframes cblink { 50%{opacity:0} }

        /* markdown */
        .md h1,.md h2,.md h3 { font-weight:600; margin:.5em 0 .25em; }
        .md h1 { font-size:1.25em; } .md h2 { font-size:1.1em; } .md h3 { font-size:1em; }
        .md ul,.md ol { padding-left:1.4em; margin:.25em 0; }
        .md li { margin:.1em 0; }
        .md code { font-family:'JetBrains Mono',monospace; background:#0f172a; padding:.1em .35em; border-radius:.25em; font-size:.82em; color:#a5f3fc; }
        .md pre { background:#0f172a; padding:.8em 1em; border-radius:.5em; overflow-x:auto; margin:.4em 0; }
        .md pre code { background:none; padding:0; color:#e2e8f0; }
        .md strong { font-weight:600; color:#f1f5f9; }
        .md em { font-style:italic; color:#cbd5e1; }
        .md blockquote { border-left:3px solid #6366f1; padding-left:.75em; color:#94a3b8; margin:.4em 0; }
        .md hr { border:none; border-top:1px solid #334155; margin:.6em 0; }
        .md p { margin:.25em 0; white-space:pre-wrap; word-break:break-word; }
        .md table { border-collapse:collapse; width:100%; margin:.4em 0; font-size:.9em; }
        .md td,.md th { border:1px solid #334155; padding:.25em .5em; text-align:left; }
        .md th { background:#1e293b; font-weight:600; }

        /* chat bubble */
        .bubble-user { background:#1e3a5f; border:1px solid #1d4ed8; border-radius:.75rem .75rem .75rem 0; }
        .bubble-model { background:#1e293b; border:1px solid #334155; border-radius:.75rem .75rem 0 .75rem; }

        /* zoom hover on images */
        .zoomable { cursor:zoom-in; transition:opacity .15s; }
        .zoomable:hover { opacity:.85; }

        ::-webkit-scrollbar { width:5px; height:5px; }
        ::-webkit-scrollbar-track { background:transparent; }
        ::-webkit-scrollbar-thumb { background:#334155; border-radius:3px; }
        ::-webkit-scrollbar-thumb:hover { background:#475569; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 h-screen flex flex-col overflow-hidden">

<!-- ── Header ──────────────────────────────────────────────────────────── -->
<header class="flex-none bg-slate-800 border-b border-slate-700 px-5 py-2.5 flex items-center justify-between shadow-md">
    <div class="flex items-center gap-3">
        <div class="w-7 h-7 bg-indigo-500 rounded-lg flex items-center justify-center font-bold text-xs select-none">V</div>
        <h1 class="font-semibold tracking-tight">AI Vision Playground</h1>
        <span class="text-slate-600 text-xs hidden sm:inline">· Ollama</span>
    </div>
    <div class="flex items-center gap-4">
        <button onclick="clearHistory()" title="Clear chat" class="text-xs text-slate-500 hover:text-red-400 transition-colors hidden" id="clear-btn">Clear chat</button>
        <div class="flex items-center gap-1.5 cursor-pointer" onclick="loadModels()" title="Refresh models">
            <div id="status-dot" class="w-2 h-2 rounded-full bg-yellow-400 animate-pulse"></div>
            <span id="status-text" class="text-xs text-slate-400">Connecting…</span>
        </div>
    </div>
</header>

<!-- ── Layout ──────────────────────────────────────────────────────────── -->
<div class="flex-1 flex overflow-hidden">

    <!-- Sidebar -->
    <aside class="w-64 flex-none bg-slate-800 border-r border-slate-700 flex flex-col overflow-y-auto">
        <div class="p-4 space-y-5">

            <!-- Model -->
            <div>
                <div class="flex items-center justify-between mb-1.5">
                    <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Model</label>
                    <button onclick="loadModels()" class="text-xs text-slate-500 hover:text-indigo-400 transition-colors">↻</button>
                </div>
                <select id="model-select" onchange="updateModelHint()"
                    class="w-full bg-slate-700 border border-slate-600 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500 transition-colors">
                    <option value="">Loading…</option>
                </select>
                <p id="model-hint" class="mt-1 text-xs min-h-[1em]"></p>
            </div>

            <!-- System Message -->
            <div>
                <div class="flex items-center justify-between mb-1.5">
                    <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">System</label>
                    <button onclick="toggleSys()" id="sys-toggle" class="text-xs text-slate-500 hover:text-indigo-400 transition-colors">hide</button>
                </div>
                <div id="sys-area">
                    <textarea id="system-input" rows="4" placeholder="System message…"
                        class="w-full bg-slate-700 border border-slate-600 rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-indigo-500 resize-none placeholder-slate-500">You are a helpful AI assistant with vision capabilities. Analyze images carefully and provide detailed, accurate responses.</textarea>
                    <button onclick="document.getElementById('system-input').value=''" class="mt-1 text-xs text-slate-600 hover:text-red-400 transition-colors">clear</button>
                </div>
            </div>

            <div class="border-t border-slate-700"></div>

            <!-- Quick Prompts -->
            <div>
                <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider block mb-2">Quick Prompts</label>
                <div class="space-y-1">
                    <button onclick="setPrompt('Describe this image in detail.')"         class="qp">Describe in detail</button>
                    <button onclick="setPrompt('What objects can you identify in this image?')" class="qp">Identify objects</button>
                    <button onclick="setPrompt('Extract and transcribe any text visible in this image.')" class="qp">Extract text (OCR)</button>
                    <button onclick="setPrompt('Analyze the mood and emotions depicted in this image.')" class="qp">Mood / emotions</button>
                    <button onclick="setPrompt('What is happening in this image? Provide context.')"   class="qp">What is happening?</button>
                    <button onclick="setPrompt('Is there anything unusual or noteworthy here?')"       class="qp">Anything unusual?</button>
                    <button onclick="setPrompt('Describe the colors, lighting, and composition.')"     class="qp">Colors &amp; composition</button>
                </div>
            </div>

            <div class="border-t border-slate-700"></div>

            <!-- Backend info -->
            <div class="text-xs text-slate-600 space-y-0.5">
                <p>Python FastAPI → <span class="text-slate-500">:8000</span></p>
                <p>Rust Axum &nbsp;&nbsp;&nbsp;→ <span class="text-slate-500">:8001</span></p>
            </div>
        </div>
    </aside>

    <!-- Main -->
    <main class="flex-1 flex flex-col overflow-hidden bg-slate-900">

        <!-- ── Chat Log ──────────────────────────────────────── -->
        <div id="chat-log" class="flex-1 overflow-y-auto px-5 py-4 space-y-5">

            <!-- Empty state -->
            <div id="empty-state" class="h-full flex flex-col items-center justify-center text-center py-16">
                <div class="text-5xl mb-4 select-none">👁</div>
                <h2 class="text-xl font-semibold text-slate-300">AI Vision Playground</h2>
                <p class="text-slate-500 text-sm mt-1.5 mb-6">Upload an image and ask anything about it</p>
                <div class="flex flex-wrap gap-2 justify-center text-xs text-slate-500">
                    <span class="bg-slate-800 rounded-full px-3 py-1">📎 Drag &amp; drop</span>
                    <span class="bg-slate-800 rounded-full px-3 py-1">📋 Ctrl+V screenshot</span>
                    <span class="bg-slate-800 rounded-full px-3 py-1">🔗 Paste image URL</span>
                </div>
                <div class="mt-8 grid grid-cols-2 gap-2 max-w-xs w-full">
                    <button onclick="setPrompt('Describe this image in detail.')"
                        class="bg-slate-800 hover:bg-slate-700 rounded-lg p-3 text-left text-xs text-slate-400 hover:text-slate-200 transition-colors">
                        📝 Describe in detail
                    </button>
                    <button onclick="setPrompt('What objects can you see here?')"
                        class="bg-slate-800 hover:bg-slate-700 rounded-lg p-3 text-left text-xs text-slate-400 hover:text-slate-200 transition-colors">
                        🔍 Identify objects
                    </button>
                    <button onclick="setPrompt('Extract and transcribe any text visible in this image.')"
                        class="bg-slate-800 hover:bg-slate-700 rounded-lg p-3 text-left text-xs text-slate-400 hover:text-slate-200 transition-colors">
                        🔤 Extract text (OCR)
                    </button>
                    <button onclick="setPrompt('Analyze the mood, colors, and composition.')"
                        class="bg-slate-800 hover:bg-slate-700 rounded-lg p-3 text-left text-xs text-slate-400 hover:text-slate-200 transition-colors">
                        🎨 Style &amp; mood
                    </button>
                </div>
            </div>
        </div>

        <!-- ── Bottom Input Bar ──────────────────────────────── -->
        <div class="flex-none border-t border-slate-700 bg-slate-900/95 backdrop-blur px-4 pt-3 pb-4 space-y-2.5">

            <!-- Image row -->
            <div class="flex items-center gap-2 min-h-[36px]">

                <!-- No image: compact controls -->
                <div id="img-controls" class="flex items-center gap-2">
                    <!-- File upload trigger -->
                    <label for="file-input" title="Upload image (or Ctrl+V to paste)"
                        class="flex items-center gap-1.5 px-3 py-1.5 bg-slate-700 hover:bg-slate-600 border border-slate-600 hover:border-indigo-500 rounded-lg text-xs text-slate-300 cursor-pointer transition-colors select-none"
                        id="drop-trigger"
                        ondragover="event.preventDefault();this.classList.add('!border-indigo-500','!bg-indigo-900/20')"
                        ondragleave="this.classList.remove('!border-indigo-500','!bg-indigo-900/20')"
                        ondrop="handleDrop(event);this.classList.remove('!border-indigo-500','!bg-indigo-900/20')">
                        📷 <span>Add image</span>
                    </label>
                    <input type="file" id="file-input" accept="image/*" onchange="handleFileSelect(event)" class="hidden">

                    <!-- URL toggle -->
                    <button onclick="toggleURLInput()" id="url-toggle"
                        class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 border border-slate-600 rounded-lg text-xs text-slate-400 transition-colors">
                        🔗 URL
                    </button>

                    <!-- Ctrl+V hint -->
                    <span class="text-xs text-slate-600 hidden sm:inline">Ctrl+V to paste screenshot</span>
                </div>

                <!-- URL input (hidden by default) -->
                <div id="url-row" class="hidden flex-1 flex gap-2">
                    <input type="url" id="url-input" placeholder="https://…/image.jpg"
                        class="flex-1 bg-slate-700 border border-slate-600 rounded-lg px-3 py-1.5 text-xs focus:outline-none focus:border-indigo-500 placeholder-slate-500"
                        onkeydown="if(event.key==='Enter')loadImageFromURL()">
                    <button onclick="loadImageFromURL()"
                        class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 rounded-lg text-xs font-medium transition-colors">Load</button>
                    <button onclick="toggleURLInput()"
                        class="px-2 py-1.5 text-slate-500 hover:text-slate-300 transition-colors text-sm">✕</button>
                </div>

                <!-- Image preview thumbnail (shown when image loaded) -->
                <div id="img-preview-bar" class="hidden flex items-center gap-2">
                    <img id="bar-thumb" onclick="openZoom(this.src)"
                        class="h-9 w-9 rounded object-cover border border-slate-600 zoomable cursor-zoom-in" alt="img">
                    <span id="bar-label" class="text-xs text-slate-400 max-w-[140px] truncate"></span>
                    <button onclick="clearImage()" class="text-slate-500 hover:text-red-400 transition-colors text-sm leading-none">✕</button>
                </div>
            </div>

            <!-- Prompt + Send row -->
            <div class="flex gap-2 items-end">
                <textarea id="prompt-input" rows="2"
                    placeholder="Ask anything about the image… (Ctrl+Enter to send)"
                    onkeydown="if(event.key==='Enter'&&event.ctrlKey){event.preventDefault();sendMessage()}"
                    class="flex-1 bg-slate-800 border border-slate-600 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500 resize-none placeholder-slate-500 leading-relaxed"></textarea>

                <div class="flex flex-col gap-1.5 pb-0.5">
                    <button id="send-btn" onclick="sendMessage()"
                        class="px-5 py-2 bg-indigo-600 hover:bg-indigo-500 disabled:bg-slate-700 disabled:text-slate-500 rounded-xl text-sm font-medium transition-colors flex items-center gap-2 whitespace-nowrap">
                        <span>Send</span>
                    </button>
                    <button id="stop-btn" onclick="stopGeneration()"
                        class="hidden px-5 py-2 bg-red-700 hover:bg-red-600 rounded-xl text-sm font-medium transition-colors whitespace-nowrap">
                        Stop
                    </button>
                </div>
            </div>
        </div>
    </main>
</div>

<!-- ── Image Zoom Modal ───────────────────────────────────────────────── -->
<div id="zoom-modal" class="hidden fixed inset-0 bg-black/85 z-50 flex items-center justify-center p-6 cursor-zoom-out"
    onclick="closeZoom()">
    <img id="zoom-img" class="max-w-full max-h-full object-contain rounded-lg shadow-2xl" alt="zoom">
    <button onclick="closeZoom()" class="absolute top-4 right-5 text-white/70 hover:text-white text-3xl leading-none font-light">×</button>
</div>

<!-- ── Toast ──────────────────────────────────────────────────────────── -->
<div id="toast" class="fixed bottom-24 right-4 px-4 py-2.5 rounded-lg text-sm shadow-xl z-50 transition-all duration-300 opacity-0 translate-y-2 pointer-events-none"></div>

<!-- ── Tailwind quick-prompt class ───────────────────────────────────── -->
<style>
.qp { @apply w-full text-left text-xs text-slate-500 hover:text-indigo-300 bg-slate-700/30 hover:bg-slate-700 rounded px-2.5 py-1.5 transition-colors; }
</style>

<script>
// ── State ──────────────────────────────────────────────────────────────
let imgFile = null, imgURL = null;
let isStreaming = false, controller = null;
let sysVisible = true;
let chatHistory = [];  // [{prompt, imgSrc, imgLabel, response, model, duration, tokens, done}]

const VISION_KW = ['llava','moondream','qwen2-vl','qwen2.5vl','gemma3','minicpm-v','bakllava','llava-phi3','llava-llama3','llama3.2-vision','llama3.2vision'];
const isVision = n => VISION_KW.some(k => n.toLowerCase().includes(k));

// ── Init ───────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
    loadModels();
    // Global paste handler — Ctrl+V to paste screenshot
    document.addEventListener('paste', handlePaste);
});

// ── Models ─────────────────────────────────────────────────────────────
async function loadModels() {
    const sel = document.getElementById('model-select');
    sel.innerHTML = '<option value="">Loading…</option>';
    setStatus('yellow', 'Connecting…');
    try {
        const data = await fetch('/api/models').then(r => r.json());
        if (data.error && !data.models?.length) {
            sel.innerHTML = '<option value="">No models</option>';
            setStatus('red', 'Ollama offline');
            showToast(data.error, 'error'); return;
        }
        sel.innerHTML = '';
        const v = data.models.filter(m => m.vision);
        const t = data.models.filter(m => !m.vision);
        if (v.length) { const g = optGroup('👁 Vision Models'); v.forEach(m => addOpt(g, m.name)); sel.appendChild(g); }
        if (t.length) { const g = optGroup('💬 Text Models');   t.forEach(m => addOpt(g, m.name)); sel.appendChild(g); }
        if (!data.models.length) sel.innerHTML = '<option value="">No models installed</option>';
        setStatus('green', `${data.models.length} model${data.models.length!==1?'s':''} ready`);
        updateModelHint();
    } catch(e) {
        sel.innerHTML = '<option value="">Error</option>';
        setStatus('red', 'Error'); showToast('Cannot reach Ollama — is it running?', 'error');
    }
}
const optGroup = l => { const g = document.createElement('optgroup'); g.label = l; return g; };
const addOpt   = (p, name) => { const o = document.createElement('option'); o.value = o.textContent = name; p.appendChild(o); };

function updateModelHint() {
    const sel = document.getElementById('model-select');
    const h   = document.getElementById('model-hint');
    if (!sel.value) { h.textContent=''; return; }
    const v = isVision(sel.value);
    h.textContent = v ? '✓ Vision capable' : '⚠ Text-only — image ignored';
    h.className = `mt-1 text-xs ${v ? 'text-green-500' : 'text-yellow-500'}`;
}

function setStatus(c, txt) {
    const map = { green:'bg-green-500', yellow:'bg-yellow-400 animate-pulse', red:'bg-red-500' };
    document.getElementById('status-dot').className = `w-2 h-2 rounded-full ${map[c]}`;
    document.getElementById('status-text').textContent = txt;
}

// ── Image handling ─────────────────────────────────────────────────────
function handleDrop(e) {
    e.preventDefault();
    const f = e.dataTransfer.files[0];
    if (f && f.type.startsWith('image/')) setImageFile(f);
    else showToast('Drop an image file', 'error');
}
function handleFileSelect(e) { if (e.target.files[0]) setImageFile(e.target.files[0]); }

function handlePaste(e) {
    const items = e.clipboardData?.items;
    if (!items) return;
    for (const item of items) {
        if (item.type.startsWith('image/')) {
            const f = item.getAsFile();
            if (f) { setImageFile(f); showToast('Screenshot pasted!'); return; }
        }
    }
}

function setImageFile(f) {
    imgFile = f; imgURL = null;
    const r = new FileReader();
    r.onload = ev => showBarPreview(ev.target.result, `${f.name}  (${fmtBytes(f.size)})`);
    r.readAsDataURL(f);
}

function toggleURLInput() {
    const row = document.getElementById('url-row');
    const ctrl = document.getElementById('img-controls');
    const open = row.classList.contains('hidden');
    row.classList.toggle('hidden', !open);
    ctrl.classList.toggle('hidden', open);
    if (open) setTimeout(() => document.getElementById('url-input').focus(), 50);
    else document.getElementById('url-input').value = '';
}

function loadImageFromURL() {
    const url = document.getElementById('url-input').value.trim();
    if (!url) return;
    imgURL = url; imgFile = null;
    showBarPreview(url, url.split('/').pop().split('?')[0] || url);
    // hide URL input
    document.getElementById('url-row').classList.add('hidden');
    document.getElementById('img-controls').classList.remove('hidden');
}

function showBarPreview(src, label) {
    document.getElementById('bar-thumb').src = src;
    document.getElementById('bar-label').textContent = label;
    document.getElementById('img-preview-bar').classList.remove('hidden');
    document.getElementById('img-controls').classList.add('hidden');
    document.getElementById('url-row').classList.add('hidden');
}

function clearImage() {
    imgFile = imgURL = null;
    document.getElementById('img-preview-bar').classList.add('hidden');
    document.getElementById('img-controls').classList.remove('hidden');
    document.getElementById('file-input').value = '';
    document.getElementById('url-input').value = '';
    document.getElementById('bar-thumb').src = '';
}

function fmtBytes(b) {
    if (b<1024) return b+' B';
    if (b<1048576) return (b/1024).toFixed(1)+' KB';
    return (b/1048576).toFixed(1)+' MB';
}

// ── System ─────────────────────────────────────────────────────────────
function toggleSys() {
    sysVisible = !sysVisible;
    document.getElementById('sys-area').classList.toggle('hidden', !sysVisible);
    document.getElementById('sys-toggle').textContent = sysVisible ? 'hide' : 'show';
}

// ── Quick prompts ───────────────────────────────────────────────────────
function setPrompt(t) {
    document.getElementById('prompt-input').value = t;
    document.getElementById('prompt-input').focus();
}

// ── Send ────────────────────────────────────────────────────────────────
async function sendMessage() {
    if (isStreaming) return;
    const model  = document.getElementById('model-select').value;
    const prompt = document.getElementById('prompt-input').value.trim();
    const system = document.getElementById('system-input').value.trim();
    if (!model)  { showToast('Select a model', 'error'); return; }
    if (!prompt && !imgFile && !imgURL) { showToast('Enter a prompt or add an image', 'error'); return; }

    // Snapshot current image for this turn
    const turnImgSrc   = imgFile ? URL.createObjectURL(imgFile) : (imgURL || null);
    const turnImgLabel = imgFile ? imgFile.name : (imgURL ? (imgURL.split('/').pop().split('?')[0]||imgURL) : '');

    // Push history entry
    const entry = { prompt: prompt || '(image)', imgSrc: turnImgSrc, imgLabel: turnImgLabel, response: '', model, duration: null, tokens: null, done: false };
    chatHistory.push(entry);
    const idx = chatHistory.length - 1;

    // Clear prompt
    document.getElementById('prompt-input').value = '';

    // Render
    hideEmptyState();
    renderEntry(idx);
    scrollToBottom();

    isStreaming = true;
    controller = new AbortController();
    setBusy(true);

    const fd = new FormData();
    fd.append('model', model);
    fd.append('prompt', prompt || 'Describe this image.');
    fd.append('system', system);
    if (imgFile) fd.append('image', imgFile);
    if (imgURL)  fd.append('image_url', imgURL);

    clearImage();

    try {
        const resp = await fetch('/api/chat', { method:'POST', body:fd, signal:controller.signal });
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);

        const reader = resp.body.getReader();
        const dec = new TextDecoder();
        let buf = '', started = false;

        while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buf += dec.decode(value, { stream:true });
            const lines = buf.split('\n'); buf = lines.pop();
            for (const line of lines) {
                if (!line.trim()) continue;
                try {
                    const d = JSON.parse(line);
                    if (d.message?.content) {
                        if (!started) { started = true; hideThinking(idx); }
                        entry.response += d.message.content;
                        updateResponseText(idx, entry.response, false);
                        scrollToBottom();
                    }
                    if (d.done) {
                        entry.done = true;
                        entry.duration = d.total_duration ? (d.total_duration/1e9).toFixed(1)+'s' : null;
                        entry.tokens   = d.eval_count ?? null;
                        updateResponseText(idx, entry.response, true);
                        updateMeta(idx, entry);
                    }
                } catch(_) {}
            }
        }
        if (!started) { hideThinking(idx); updateResponseText(idx, '(No response)', true); }
    } catch(e) {
        if (e.name === 'AbortError') {
            entry.done = true;
            hideThinking(idx);
            updateResponseText(idx, entry.response + '\n\n*(stopped)*', true);
        } else {
            hideThinking(idx);
            updateResponseText(idx, `**Error:** ${e.message}`, true);
            showToast('Request failed: '+e.message, 'error');
        }
    } finally {
        isStreaming = false; controller = null;
        setBusy(false);
    }
}

function stopGeneration() {
    if (controller) controller.abort();
}

function setBusy(on) {
    document.getElementById('send-btn').disabled = on;
    document.getElementById('send-btn').classList.toggle('hidden', on);
    document.getElementById('stop-btn').classList.toggle('hidden', !on);
}

// ── Chat rendering ──────────────────────────────────────────────────────
function hideEmptyState() {
    document.getElementById('empty-state').classList.add('hidden');
    document.getElementById('clear-btn').classList.remove('hidden');
}

function scrollToBottom() {
    const log = document.getElementById('chat-log');
    log.scrollTop = log.scrollHeight;
}

function renderEntry(idx) {
    const e = chatHistory[idx];
    const log = document.getElementById('chat-log');

    const wrap = document.createElement('div');
    wrap.id = `entry-${idx}`;
    wrap.className = 'space-y-2';

    // User bubble
    const userBubble = document.createElement('div');
    userBubble.className = 'flex items-start gap-3 justify-end';
    userBubble.innerHTML = `
        <div class="max-w-[80%] space-y-2">
            ${e.imgSrc ? `<div class="flex justify-end"><img src="${e.imgSrc}" onclick="openZoom('${e.imgSrc}')" class="max-h-40 max-w-[240px] rounded-lg border border-slate-600 object-cover zoomable" alt="img"></div>` : ''}
            ${e.prompt !== '(image)' ? `<div class="bubble-user px-4 py-2.5 text-sm text-slate-100">${escHtml(e.prompt)}</div>` : ''}
        </div>
        <div class="w-7 h-7 rounded-full bg-indigo-600 flex items-center justify-center text-xs font-bold flex-none mt-0.5 select-none">U</div>
    `;

    // Model bubble
    const modelBubble = document.createElement('div');
    modelBubble.className = 'flex items-start gap-3';
    modelBubble.innerHTML = `
        <div class="w-7 h-7 rounded-full bg-slate-600 flex items-center justify-center text-xs font-bold flex-none mt-0.5 select-none">AI</div>
        <div class="flex-1 min-w-0">
            <div class="bubble-model px-4 py-3">
                <div id="thinking-${idx}" class="flex items-center gap-2 text-slate-400 text-sm">
                    <span class="text-indigo-400">Thinking</span>
                    <span class="thinking-dots text-indigo-400"><span>.</span><span>.</span><span>.</span></span>
                </div>
                <div id="resp-text-${idx}" class="md text-slate-200 text-sm leading-relaxed hidden"></div>
            </div>
            <div id="meta-${idx}" class="mt-1 text-xs text-slate-600 px-1 hidden mono"></div>
        </div>
    `;

    wrap.appendChild(userBubble);
    wrap.appendChild(modelBubble);
    log.appendChild(wrap);
}

function hideThinking(idx) {
    const t = document.getElementById(`thinking-${idx}`);
    const r = document.getElementById(`resp-text-${idx}`);
    if (t) t.classList.add('hidden');
    if (r) r.classList.remove('hidden');
}

function updateResponseText(idx, text, done) {
    const el = document.getElementById(`resp-text-${idx}`);
    if (!el) return;
    el.innerHTML = renderMd(text);
    if (!done) el.classList.add('cursor');
    else       el.classList.remove('cursor');
}

function updateMeta(idx, entry) {
    const el = document.getElementById(`meta-${idx}`);
    if (!el) return;
    const parts = [entry.model];
    if (entry.duration) parts.push(entry.duration);
    if (entry.tokens)   parts.push(entry.tokens + ' tok');
    el.textContent = parts.join(' · ');
    el.classList.remove('hidden');
}

function clearHistory() {
    chatHistory = [];
    const log = document.getElementById('chat-log');
    // Remove all entry-* nodes
    Array.from(log.querySelectorAll('[id^="entry-"]')).forEach(n => n.remove());
    document.getElementById('empty-state').classList.remove('hidden');
    document.getElementById('clear-btn').classList.add('hidden');
}

// ── Zoom modal ──────────────────────────────────────────────────────────
function openZoom(src) {
    document.getElementById('zoom-img').src = src;
    document.getElementById('zoom-modal').classList.remove('hidden');
    event.stopPropagation();
}
function closeZoom() { document.getElementById('zoom-modal').classList.add('hidden'); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeZoom(); });

// ── Markdown (lightweight, no deps) ────────────────────────────────────
function renderMd(text) {
    let h = escHtml(text)
        .replace(/```[\w]*\n?([\s\S]*?)```/g, (_,c)=>`<pre><code>${c.trimEnd()}</code></pre>`)
        .replace(/`([^`\n]+)`/g, '<code>$1</code>')
        .replace(/^### (.+)$/gm,'<h3>$1</h3>')
        .replace(/^## (.+)$/gm,'<h2>$1</h2>')
        .replace(/^# (.+)$/gm,'<h1>$1</h1>')
        .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
        .replace(/\*(.+?)\*/g,'<em>$1</em>')
        .replace(/^---$/gm,'<hr>')
        .replace(/^> (.+)$/gm,'<blockquote>$1</blockquote>')
        .replace(/^\s*[-*+] (.+)$/gm,'<li>$1</li>')
        .replace(/^\s*\d+\. (.+)$/gm,'<li>$1</li>')
        .replace(/\n{2,}/g,'</p><p>')
        .replace(/\n/g,'<br>');
    return `<p>${h}</p>`;
}
function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Toast ───────────────────────────────────────────────────────────────
let _tt;
function showToast(msg, type='info') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = `fixed bottom-24 right-4 px-4 py-2.5 rounded-lg text-sm shadow-xl z-50 transition-all duration-300 ${
        type==='error' ? 'bg-red-700 text-white' : 'bg-slate-700 text-slate-100'
    }`;
    t.style.opacity='1'; t.style.transform='translateY(0)';
    clearTimeout(_tt);
    _tt = setTimeout(()=>{ t.style.opacity='0'; t.style.transform='translateY(.5rem)'; }, 3500);
}
</script>
</body>
