[package]
name = "ai-vision-playground"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "server"
path = "src/main.rs"

[dependencies]
axum         = { version = "0.7", features = ["multipart"] }
tokio        = { version = "1",   features = ["full"] }
tower-http   = { version = "0.5", features = ["cors"] }
reqwest      = { version = "0.12", features = ["json", "stream"] }
serde        = { version = "1",   features = ["derive"] }
serde_json   = "1"
base64       = "0.22"
bytes        = "1"
futures      = "0.3"
tokio-stream = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
